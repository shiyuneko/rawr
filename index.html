<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=800, height=400, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Category Values Calculator - Step by Step with Breakdown</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #ccc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      background: #121212;
      border: 2px solid #333;
      border-radius: 12px;
      width: 800px;
      height: 400px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      color: #ddd;
    }

    .page {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding-right: 12px;
    }

    .page.active {
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin-top: 0;
      font-weight: 600;
      font-size: 1.8rem;
      color: #bbb;
      margin-bottom: 16px;
    }

    label {
      font-weight: 600;
      margin: 8px 0 4px 0;
      display: block;
    }

    input[type=number], input[type=text] {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 1rem;
      background-color: #222;
      color: #ccc;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    button {
      background-color: #222;
      color: #bbb;
      padding: 10px 16px;
      font-weight: 700;
      border: 1.5px solid #444;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
      margin: 10px 8px 0 0;
      user-select: none;
    }

    button:hover:not(:disabled) {
      background-color: #666;
      color: #000;
      border-color: #999;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .category-form {
      flex: 1;
      background: #181818;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 6px #222 inset;
      display: flex;
      flex-direction: column;
    }

    .subcategory {
      margin-bottom: 14px;
    }

    .subcategory > h3 {
      margin: 4px 0 6px 0;
      color: #aaa;
      font-weight: 600;
    }

    .pairs-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
    }

    .pair-row {
      display: flex;
      gap: 8px;
    }

    .pair-row input[type=text],
    .pair-row input[type=number] {
      font-size: 0.95rem;
    }
    .pair-row input[type=text] {
      flex: 1 1 auto;
    }
    .pair-row input[type=number] {
      flex: 0 0 80px;
    }

    .add-pair-btn {
      font-size: 0.85rem;
      background: #111;
      color: #888;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      align-self: flex-start;
      padding: 4px 10px;
      margin-top: 3px;
      user-select: none;
    }
    .add-pair-btn:hover {
      background: #555;
      color: #ddd;
      border-color: #888;
    }

    #navigation {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    #resultsList {
      overflow-y: auto;
      max-height: 100%;
      padding-right: 8px;
    }

    .result-item {
      border-bottom: 1px solid #333;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 1.15rem;
      background-color: #222;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-name {
      font-weight: 700;
      font-size: 1.3rem;
    }

    .result-total {
      font-weight: 700;
      font-size: 1.3rem;
      color: #7de8d5;
    }

    .breakdown {
      margin-top: 8px;
      border-top: 1px solid #444;
      padding-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px 20px;
      font-weight: 400;
      font-size: 0.95rem;
      color: #999;
    }

    .breakdown-item {
      display: flex;
      flex-direction: column;
    }

    .subcat-name {
      font-weight: 600;
      color: #aacccc;
      margin-bottom: 2px;
    }

    .subcat-info {
      white-space: nowrap;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111;
    }
    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 8px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Page 0: Input number of categories -->
  <section id="pageNumber" class="page active" tabindex="0">
    <h1>Step 1: Number of Categories</h1>
    <label for="numCategories">Enter the number of categories (required):</label>
    <input type="number" id="numCategories" min="1" value="1" required />
    <div id="navigationNum">
      <button id="numNextBtn" type="button">Next &raquo;</button>
    </div>
  </section>

  <!-- Category input pages (1 to N), dynamically created -->
  <section id="pageCategory" class="page" tabindex="0">
    <h1>Category Input</h1>
    <div id="categoryFormContainer" class="category-form">
      <!-- Dynamic content goes here -->
    </div>
    <div id="navigationCat">
      <button id="catPrevBtn" type="button">&laquo; Previous</button>
      <button id="catNextBtn" type="button">Next &raquo;</button>
    </div>
  </section>

  <!-- Results page -->
  <section id="pageResults" class="page" tabindex="0">
    <h1>Results</h1>
    <div id="resultsList" aria-live="polite" role="region" style="flex:1; overflow-y:auto;"></div>
    <div id="navigationResults">
      <button id="resultsBackBtn" type="button">&laquo; Back</button>
      <button id="resultsResetBtn" type="button">Start Over</button>
    </div>
  </section>
</div>

<script>
  (function() {
    const pages = {
      number: document.getElementById('pageNumber'),
      category: document.getElementById('pageCategory'),
      results: document.getElementById('pageResults'),
    };

    // Controls for navigation
    const numCategoriesInput = document.getElementById('numCategories');
    const numNextBtn = document.getElementById('numNextBtn');

    const categoryFormContainer = document.getElementById('categoryFormContainer');
    const catPrevBtn = document.getElementById('catPrevBtn');
    const catNextBtn = document.getElementById('catNextBtn');

    const resultsList = document.getElementById('resultsList');
    const resultsBackBtn = document.getElementById('resultsBackBtn');
    const resultsResetBtn = document.getElementById('resultsResetBtn');

    // Fixed subcategories and multipliers
    const subCategories = [
      { name: 'a', value: 2 },
      { name: 'b', value: 3 },
      { name: 'c', value: 4 },
      { name: 'd', value: 5 },
      { name: 'e', value: 6 },
      { name: 'f', value: 7 }
    ];

    let numCategories = 1;
    let currentCategoryIndex = 0;
    // Data structure to hold inputs per category index:
    // array of objects: each has {subcatIdx: [{name, value}, ...], ...}
    const categoryData = [];

    function showPage(name) {
      for(let key in pages) {
        if(key === name) {
          pages[key].classList.add('active');
          pages[key].focus();
        } else {
          pages[key].classList.remove('active');
        }
      }
    }

    // Initial page: user inputs number of categories
    numNextBtn.addEventListener('click', () => {
      const val = parseInt(numCategoriesInput.value);
      if(isNaN(val) || val < 1) {
        alert('Please enter a valid number of categories (at least 1).');
        return;
      }
      numCategories = val;
      resetCategoryData();
      currentCategoryIndex = 0;
      buildCategoryForm(currentCategoryIndex);
      showPage('category');
    });

    // Reset category data array with empty data for all categories
    function resetCategoryData() {
      categoryData.length = 0;
      for(let i=0; i<numCategories; i++) {
        // For each category: pre-create empty arrays for each subcategory index (0 to 5)
        const catObj = {};
        subCategories.forEach((_, idx) => {
          catObj[idx] = [{name:'', value:''}]; // start with one empty pair for input
        });
        categoryData.push(catObj);
      }
    }

    // Build form inputs for given category index
    function buildCategoryForm(catIndex) {
      if(catIndex < 0 || catIndex >= numCategories) return;
      categoryFormContainer.innerHTML = '';
      const heading = document.createElement('h2');
      heading.textContent = `Category #${catIndex + 1} of ${numCategories}`;
      heading.style.marginBottom = '14px';
      categoryFormContainer.appendChild(heading);

      subCategories.forEach((subcat, subIdx) => {
        const subDiv = document.createElement('div');
        subDiv.className = 'subcategory';

        const subHead = document.createElement('h3');
        subHead.textContent = `Subcategory ${subcat.name} (multiplier ${subcat.value})`;
        subDiv.appendChild(subHead);

        const pairsContainer = document.createElement('div');
        pairsContainer.className = 'pairs-container';

        // Load saved pairs or create one empty pair if none
        const savedPairs = categoryData[catIndex][subIdx];
        savedPairs.forEach(pair => {
          addNameValuePair(pairsContainer, pair.name, pair.value);
        });

        // Add button to add pair
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'add-pair-btn';
        addBtn.textContent = '+ Add Name & Value';
        addBtn.addEventListener('click', () => addNameValuePair(pairsContainer));
        subDiv.appendChild(pairsContainer);
        subDiv.appendChild(addBtn);

        categoryFormContainer.appendChild(subDiv);
      });

      updateNavigationButtons();
    }

    // Add name-value row, optionally with provided values
    function addNameValuePair(container, nameVal = '', valueVal = '') {
      const pairRow = document.createElement('div');
      pairRow.className = 'pair-row';

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'Name (optional)';
      nameInput.autocomplete = 'off';
      nameInput.value = nameVal;
      pairRow.appendChild(nameInput);

      const valueInput = document.createElement('input');
      valueInput.type = 'number';
      valueInput.placeholder = 'Value (optional)';
      valueInput.step = 'any';
      valueInput.min = '0';
      valueInput.value = valueVal;
      pairRow.appendChild(valueInput);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.title = 'Remove this pair';
      removeBtn.style.background = '#440000';
      removeBtn.style.color = '#ff9999';
      removeBtn.style.border = 'none';
      removeBtn.style.borderRadius = '4px';
      removeBtn.style.cursor = 'pointer';
      removeBtn.style.fontWeight = '700';
      removeBtn.style.width = '28px';
      removeBtn.style.height = '28px';
      removeBtn.style.padding = '0';
      removeBtn.style.marginLeft = '4px';
      removeBtn.addEventListener('click', () => pairRow.remove());
      pairRow.appendChild(removeBtn);

      container.appendChild(pairRow);
      nameInput.focus();
    }

    // Save current form inputs into categoryData[currentCategoryIndex]
    function saveCategoryForm() {
      const subcats = categoryFormContainer.querySelectorAll('.subcategory');
      subcats.forEach((subcatDiv, subIdx) => {
        const pairsContainer = subcatDiv.querySelector('.pairs-container');
        if(!pairsContainer) return;
        const pairs = pairsContainer.querySelectorAll('.pair-row');
        const dataPairs = [];
        pairs.forEach(pair => {
          const inputs = pair.querySelectorAll('input');
          if(inputs.length < 2) return;
          const name = inputs[0].value.trim();
          const val = inputs[1].value.trim();
          dataPairs.push({name, value: val});
        });
        categoryData[currentCategoryIndex][subIdx] = dataPairs;
      });
    }

    // Validate inputs on current category page:
    // - For each pair: if one of name or value filled, both required and value >=0
    // - Pairs both empty ignored
    function validateCurrentCategory() {
      const subcats = categoryFormContainer.querySelectorAll('.subcategory');
      for(let subcatDiv of subcats) {
        const pairs = subcatDiv.querySelectorAll('.pair-row');
        for(let pair of pairs) {
          const inputs = pair.querySelectorAll('input');
          if(inputs.length<2) continue;
          const nameRaw = inputs[0].value.trim();
          const valRaw = inputs[1].value.trim();
          if(nameRaw === '' && valRaw === '') continue;
          if(nameRaw === '' || valRaw === '') {
            alert('If either name or value is entered, both fields are required for that pair.');
            return false;
          }
          let valNum = Number(valRaw);
          if(isNaN(valNum) || valNum < 0) {
            alert('Please enter valid non-negative numbers for values.');
            return false;
          }
        }
      }
      return true;
    }

    // Update navigation buttons (disable prev on first, change next label on last)
    function updateNavigationButtons() {
      catPrevBtn.disabled = (currentCategoryIndex === 0);
      if(currentCategoryIndex === numCategories - 1) {
        catNextBtn.textContent = 'Show Results';
      } else {
        catNextBtn.textContent = 'Next »';
      }
    }

    // Navigate category pages prev/next
    catPrevBtn.addEventListener('click', () => {
      saveCategoryForm();
      if(currentCategoryIndex > 0) {
        currentCategoryIndex--;
        buildCategoryForm(currentCategoryIndex);
      }
    });

    catNextBtn.addEventListener('click', () => {
      // Validate current category inputs before proceeding
      if(!validateCurrentCategory()) return;

      saveCategoryForm();

      if(currentCategoryIndex < numCategories - 1) {
        currentCategoryIndex++;
        buildCategoryForm(currentCategoryIndex);
      } else {
        // Show results page
        showResultsPage();
      }
    });

    // On results "Back" go back to last category input page
    resultsBackBtn.addEventListener('click', () => {
      showPage('category');
      buildCategoryForm(currentCategoryIndex);
    });

    // On results "Start Over" go back to first page blank
    resultsResetBtn.addEventListener('click', () => {
      currentCategoryIndex = 0;
      categoryData.length = 0;
      numCategoriesInput.value = '1';
      showPage('number');
    });

    // Show results page with calculated data and breakdown per subcategory
    function showResultsPage() {
      // Aggregate totals for all names across all categories & subcategories
      const nameSubcatValues = {};
      categoryData.forEach(cat => {
        for(let subcatIdx in cat) {
          const pairs = cat[subcatIdx];
          pairs.forEach(pair => {
            if(!pair.name || pair.name.trim()==='' || !pair.value || pair.value.trim()==='') return;
            const name = pair.name.trim();
            const valNum = Number(pair.value);
            if(isNaN(valNum)) return;
            if(!nameSubcatValues[name]) {
              nameSubcatValues[name] = {};
            }
            if(!nameSubcatValues[name][subcatIdx]) {
              nameSubcatValues[name][subcatIdx] = 0;
            }
            nameSubcatValues[name][subcatIdx] += valNum;
          });
        }
      });

      const resultsData = [];
      for(let name in nameSubcatValues) {
        const perSubcat = nameSubcatValues[name];
        let total = 0;
        const breakdown = [];
        for(let subcatIdx in perSubcat) {
          const subcatName = subCategories[subcatIdx].name;
          const multiplier = subCategories[subcatIdx].value;
          const rawValue = perSubcat[subcatIdx];
          const subTotal = rawValue * multiplier;
          total += subTotal;
          breakdown.push({subcatName, rawValue, multiplier, subTotal});
        }
        // Sort breakdown by multiplier descending for nicer display
        breakdown.sort((a,b) => b.multiplier - a.multiplier);
        resultsData.push({name, total, breakdown});
      }

      resultsData.sort((a,b) => a.name.localeCompare(b.name));

      resultsList.innerHTML = '';
      if(resultsData.length === 0) {
        resultsList.textContent = 'No valid name-value pairs were entered.';
      } else {
        resultsData.forEach(r => {
          const container = document.createElement('div');
          container.className = 'result-item';

          // Main total line
          const mainLine = document.createElement('div');
          mainLine.className = 'result-header';
          const nameDiv = document.createElement('div');
          nameDiv.className = 'result-name';
          nameDiv.textContent = r.name;
          const totalDiv = document.createElement('div');
          totalDiv.className = 'result-total';
          totalDiv.textContent = r.total.toFixed(4);
          mainLine.appendChild(nameDiv);
          mainLine.appendChild(totalDiv);
          container.appendChild(mainLine);

          // Breakdown
          const breakdownDiv = document.createElement('div');
          breakdownDiv.className = 'breakdown';
          r.breakdown.forEach(b => {
            const breakdownItem = document.createElement('div');
            breakdownItem.className = 'breakdown-item';

            const subcatName = document.createElement('div');
            subcatName.className = 'subcat-name';
            subcatName.textContent = `Subcategory '${b.subcatName}'`;

            const subcatInfo = document.createElement('div');
            subcatInfo.className = 'subcat-info';
            subcatInfo.textContent =
                    `Sum: ${b.rawValue.toFixed(4)}, Multiplier: ${b.multiplier}, Subtotal: ${b.subTotal.toFixed(4)}`;

            breakdownItem.appendChild(subcatName);
            breakdownItem.appendChild(subcatInfo);

            breakdownDiv.appendChild(breakdownItem);
          });
          container.appendChild(breakdownDiv);

          resultsList.appendChild(container);
        });
      }

      showPage('results');
    }

    // Initial setup: show first page only
    showPage('number');

  })();
</script>
</body>
</html>
